[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/event-bus",
    "crates/event-bus-rabbitmq",
    "crates/ordering-api",
    "crates/ordering-domain",
    "crates/ordering-infrastructure",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Onyeka Obi"]
repository = "https://github.com/MavenRain/eshop-rs"

[workspace.dependencies]
comp-cat-rs = { path = "../comp-cat-rs" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", default-features = false, features = ["v4", "std", "serde"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
lapin = { version = "2", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
futures-lite = { version = "2", default-features = false, features = ["std"] }
toasty = { path = "../toasty/crates/toasty", features = ["sqlite", "postgresql", "jiff", "rust_decimal"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
