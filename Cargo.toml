[workspace]
resolver = "3"
members = ["crates/ordering-domain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Onyeka Obi"]
repository = "https://github.com/MavenRain/eshop-rs"

[workspace.dependencies]
comp-cat-rs = { path = "../comp-cat-rs" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
