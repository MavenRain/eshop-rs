<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eShop</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
      }
      main {
        max-width: 1024px;
        margin: 0 auto;
        padding: 1rem;
      }
      nav {
        background: #1f2937;
        color: #f9fafb;
        padding: 0.75rem 1rem;
      }
      nav a {
        color: #f9fafb;
        margin-right: 1rem;
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input {
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.25rem;
        width: 16rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="dist/main.js"></script>
    <script>
      const app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: {
          apiBase: window.ESHOP_API_BASE || "http://127.0.0.1:8080"
        }
      });
    </script>
  </body>
</html>
